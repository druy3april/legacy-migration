name: legacy-migration

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legacy-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legacy-sql-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./sql:/sql:ro,z
      - ./scripts/init_sql.sh:/init_sql.sh:ro,z
    entrypoint: ["/bin/bash", "/init_sql.sh"]
    restart: "no"

volumes:
  sqlserver_data: