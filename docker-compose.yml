name: legacy-migration

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legacy-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"  
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legacy-sql-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./sql:/sql:ro,z
      - ./scripts/init_sql.sh:/init_sql.sh:ro,z
    entrypoint: ["/bin/bash", "/init_sql.sh"]
    restart: "no"

  postgres:
    image: postgres:16
    container_name: legacy-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    container_name: legacy-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: legacy-airflow
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow/scripts
      MSSQL_HOST: sqlserver
      MSSQL_PORT: "1433"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./airflow/dags:/opt/airflow/dags:z
      - ./airflow/plugins:/opt/airflow/plugins:z
      - ./scripts:/opt/airflow/scripts:ro,z
      - airflow_logs:/opt/airflow/logs
    

volumes:
  sqlserver_data:
  postgres_data:
  minio_data:
  airflow_logs: