version: 2

sources:
  - name: raw
    schema: raw
    description: "Dữ liệu tải tăng dần từ SQL Server (upsert theo khóa, xem ADR-0002)"
    tables:
      - name: customers
      - name: products
      - name: orders
      - name: order_items

  - name: etl
    schema: etl
    tables:
      - name: freshness_customers
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: freshness_products
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: freshness_orders
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: freshness_order_items
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
