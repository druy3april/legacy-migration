name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python - ruff + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Cài thư viện
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .
      - name: Unit test (guard xóa, đối soát)
        run: python -m unittest discover -s tests -v

  dbt:
    name: dbt - sqlfluff + build trên dữ liệu mẫu
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: warehouse
      PGPASSWORD: ci_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dbt.txt
            requirements-dev.txt
      - name: Cài dbt + SQLFluff
        run: pip install -r requirements-dbt.txt -r requirements-dev.txt
      - name: Tạo schema warehouse và nạp dữ liệu mẫu
        run: |
          psql -h localhost -U warehouse -d warehouse -v ON_ERROR_STOP=1 -q -f warehouse/init.sql
          psql -h localhost -U warehouse -d warehouse -v ON_ERROR_STOP=1 -f ci/seed_sample.sql
      - name: dbt debug
        working-directory: dbt_project
        run: dbt debug --profiles-dir .
      - name: Lint SQL
        run: sqlfluff lint dbt_project/models dbt_project/tests
      - name: dbt build (model + test)
        working-directory: dbt_project
        run: dbt build --profiles-dir . --fail-fast
      - name: dbt source freshness
        working-directory: dbt_project
        run: dbt source freshness --profiles-dir .
      - name: Lưu log dbt khi lỗi
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-logs
          path: |
            dbt_project/target/run_results.json
            dbt_project/logs/dbt.log
          if-no-files-found: ignore