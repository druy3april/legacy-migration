# CI cho mỗi pull request và mỗi lần push lên main.
# Ba job chạy song song; bật "Require status checks" cho cả ba để chặn merge khi đỏ (README, mục CI).
name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python - ruff + unit test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cài thư viện
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Unit test
        run: python -m unittest discover -s tests -v

  dbt:
    name: dbt - sqlfluff + build trên dữ liệu mẫu
    needs: terraform
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse_ci
          POSTGRES_DB: test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse_ci
      POSTGRES_DB: test_ci
      MIGRATION_TEST_DB: test_ci
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: warehouse
      PGPASSWORD: warehouse_ci
      PGDATABASE: test_ci
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dbt.txt
            requirements-dev.txt

      - name: Terraform phải thành công để status check bắt buộc được xanh
        env:
          TF_RESULT: ${{ needs.terraform.result }}
        run: test "$TF_RESULT" = success

      - name: Cài dbt + SQLFluff
        run: pip install -r requirements.txt -r requirements-dbt.txt -r requirements-dev.txt

      - name: Khởi tạo warehouse (schema raw, etl, recon, view)
        run: psql -v ON_ERROR_STOP=1 -f warehouse/init.sql

      - name: Nạp dữ liệu mẫu vào raw
        run: psql -v ON_ERROR_STOP=1 -f ci/sample_raw_data.sql

      - name: Unit và SQL integration tests
        run: python -m unittest discover -s tests -v

      - name: dbt compile
        working-directory: dbt_project
        run: dbt compile

      - name: dbt build (model + test)
        working-directory: dbt_project
        run: dbt build

      - name: dbt source freshness
        working-directory: dbt_project
        run: dbt source freshness

      - name: So con số mart với kết quả kỳ vọng
        run: psql -v ON_ERROR_STOP=1 -f ci/assert_expected_marts.sql

      - name: SQLFluff
        run: sqlfluff lint dbt_project/models dbt_project/tests

  terraform:
    name: Terraform - fmt + validate + plan giả lập
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan (khóa giả, không cần tài khoản AWS)
        run: terraform plan -input=false -lock=false
